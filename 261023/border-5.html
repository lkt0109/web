<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>박스모델</title>
        <style>
            div{
                width: 250px;
                height: 300px;
                margin: 20px;
                display: inline-block;
                border: 2px solid;
                border-radius: 70px/40px;
            }
            .bg{
                background: url(images/bird.jpg) no-repeat;
                background-size: cover;
                background-position: center;
            }
        </style>
    </head>

    <body>
        <div></div>
        <div class="bg"></div>
    </body>
</html>
